<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito — Maria Rogéria</title>
    <link href="https://cloudflare.com" rel="stylesheet">
    <link href="/static/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 380px;">
        <div class="card border-0 shadow-sm rounded-4 p-4">
            <h1 class="h5 fw-bold text-center mb-3">🔐 Painel da Loja</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small">Senha de Acesso</label>
                    <input type="password" name="senha" class="form-control form-control-lg" placeholder="••••••" required autofocus>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 rounded-3">Entrar</button>
                <a href="/" class="btn btn-link w-100 mt-2 text-muted small text-decoration-none">← Voltar para a vitrine</a>
            </form>
        </div>
    </div>
</body>
</html>
